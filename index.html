<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1f4068, #162447);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
            color: #e43f5a;
            text-shadow: 0 0 20px rgba(228, 63, 90, 0.6);
        }

        p {
            font-size: 1.5rem;
            color: #1abc9c;
            animation: fadeIn 3s ease-in-out;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Confetti styles */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            top: -10px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="wishTitle">Happy Birthday! 🎉</h1>
        <p>May your day be filled with lots of joy and laughter.</p>
    </div>

    <script>
        // Dynamic Confetti Generator
        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            
            // Random styling for dynamic effect
            confetti.style.left = Math.random() * window.innerWidth + 'px';
            confetti.style.backgroundColor = getRandomColor();
            confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
            confetti.style.opacity = Math.random();
            confetti.style.transform = `scale(${Math.random() * 1.5 + 0.5})`;

            document.body.appendChild(confetti);

            // Remove after animation ends
            setTimeout(() => {
                confetti.remove();
            }, 5000);
        }

        function getRandomColor() {
            const colors = ['#f39c12', '#e74c3c', '#9b59b6', '#3498db', '#2ecc71', '#f1c40f'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // Generate confetti continuously
        setInterval(createConfetti, 100);
    </script>
</body>
</html>
